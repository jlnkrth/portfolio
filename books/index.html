<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books - Julian Kreth</title>
    <meta name="description" content="Books Julian Kreth has read and recommends." />
    <link rel="canonical" href="https://kreth.work/books/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EJK%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css?v=63" />
    <link rel="stylesheet" href="/books/book-modal.css?v=3" />
    <link rel="preload" href="/data/collections.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="chrome-top"></div>
    <div class="layout">
      <div id="chrome-sidebar"></div>
      <div class="root">
        <main>
          <section class="book-featured is-pending" aria-label="Featured" style="--enter-delay: 0ms">
            <span class="label">Featured</span>
            <a class="book-featured__link" href="/books/unreasonable-hospitality/">
              <img
                class="book-featured__cover"
                src="/assets/books/unreasonable-hospitality.jpg"
                alt=""
                width="112"
                height="168"
                decoding="async"
                fetchpriority="high"
              />
              <span class="book-featured__copy">
                <span class="book-featured__title">Unreasonable Hospitality</span>
                <span class="book-featured__author">Will Guidara</span>
                <span class="book-featured__now">
                  <span class="book-featured__now-dot" aria-hidden="true"></span>
                  Currently reading
                </span>
              </span>
            </a>
          </section>
          <div class="collection-grid" data-collection="books" data-collection-kind="book"></div>
        </main>
      </div>
    </div>
    <script src="/books/book-modal.js?v=3"></script>
    <script src="/layout.js"></script>
    <script src="/collection.js?v=2"></script>
  </body>
</html>
