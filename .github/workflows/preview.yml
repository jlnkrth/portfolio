name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Workers preview
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID. Add both as repository secrets, then re-run this workflow."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment setup instructions
        if: steps.secrets.outputs.ready != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- kreth-preview-bot -->';
            const body = [
              marker,
              '## Preview deploy',
              '',
              'This PR can get a live Workers preview URL, but the repo is missing secrets:',
              '',
              '1. Cloudflare dashboard → **My Profile → API Tokens** → create a token with **Edit Cloudflare Workers**',
              '2. Repo **Settings → Secrets and variables → Actions** → add:',
              '   - `CLOUDFLARE_API_TOKEN`',
              '   - `CLOUDFLARE_ACCOUNT_ID` (Workers overview → Account ID)',
              '3. Re-run the **Preview** workflow on this PR',
              '',
              'Until then, drafts are only in the branch HTML (no hosted preview).',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run build

      - name: Alias for this PR
        if: steps.secrets.outputs.ready == 'true'
        id: alias
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: sanitize branch name
            raw="${GITHUB_REF_NAME,,}"
            safe=$(echo "$raw" | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | cut -c1-40)
            echo "name=branch-${safe}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Worker preview version
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }} --message "Preview ${{ steps.alias.outputs.name }} @ ${{ github.sha }}"

      - name: Parse preview URLs + draft links
        if: steps.secrets.outputs.ready == 'true'
        id: urls
        env:
          CMD_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          alias_url=$(printf '%s\n' "$CMD_OUTPUT" | sed -n 's/.*Version Preview Alias URL:[[:space:]]*//p' | head -1 | tr -d '\r')
          version_url=$(printf '%s\n' "$CMD_OUTPUT" | sed -n 's/.*Version Preview URL:[[:space:]]*//p' | head -1 | tr -d '\r')
          if [ -z "$alias_url" ]; then
            alias_url=$(printf '%s\n' "$CMD_OUTPUT" | grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' | head -1 || true)
          fi
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "version_url=$version_url" >> "$GITHUB_OUTPUT"
          if [ -n "$alias_url" ]; then
            node scripts/list-draft-notes.mjs --base "$alias_url" > /tmp/draft-links.md
          else
            echo "_Preview URL missing from wrangler output — check the Upload step logs._" > /tmp/draft-links.md
          fi
          {
            echo 'drafts<<EOF'
            cat /tmp/draft-links.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview on PR
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.urls.outputs.alias_url }}
          VERSION_URL: ${{ steps.urls.outputs.version_url }}
          DRAFTS: ${{ steps.urls.outputs.drafts }}
        with:
          script: |
            const marker = '<!-- kreth-preview-bot -->';
            const alias = process.env.ALIAS_URL || '';
            const version = process.env.VERSION_URL || '';
            const drafts = (process.env.DRAFTS || '').trim();
            const lines = [
              marker,
              '## Preview deploy',
              '',
              alias
                ? `**Branch preview:** ${alias}`
                : '_Could not parse alias URL from wrangler output._',
            ];
            if (version) lines.push(`**This commit:** ${version}`);
            lines.push('', '### Draft notes on this branch', '', drafts || '_None detected._', '');
            lines.push(
              '<sub>Stable alias updates on each push. Production (`kreth.work`) is untouched.</sub>'
            );
            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
